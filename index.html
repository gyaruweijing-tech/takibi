<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>焚き火</title>
<style>
  :root { --card: #fbfaf7; --ink: #2a2622; --sub: #6d655c; --line: #e6e0d6; --accent: #b4582a; }
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(#1a120c, #030303 70%); z-index: 10; }
  .card { background: var(--card); color: var(--ink); border-radius: 18px; padding: 28px 30px; width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 60px #0008; }
  .card h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .08em; }
  .card p { margin: 6px 0; color: var(--sub); line-height: 1.7; font-size: 14px; }
  .card ul { margin: 12px 0 18px; padding-left: 1.2em; color: var(--ink); font-size: 14px; line-height: 1.9; }
  .card button { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .card button:disabled { background: #c9beb2; cursor: wait; }
  .card .note { font-size: 12px; margin-top: 10px; }
  #hud { position: fixed; left: 16px; bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 5; pointer-events: none; }
  #hud span { background: #fbfaf7d9; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  #hud span.on { background: var(--accent); color: #fff; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: #fbfaf7e6; color: var(--ink); padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .4s; z-index: 6; pointer-events: none; }
  #debug { position: fixed; right: 12px; top: 12px; background: #fbfaf7e6; color: var(--ink); font: 12px/1.55 ui-monospace, monospace; padding: 10px 12px; border-radius: 10px; white-space: pre; z-index: 6; display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.0/rapier.mjs"
} }
</script>
</head>
<body>
<div id="start">
  <div class="card">
    <h1>焚き火</h1>
    <p>夜。地面に掘った石囲炉の前に座っている。</p>
    <ul>
      <li>下の棚で材料を選ぶとカーソルについてくる。<b>マウスの上下で高さ、クリックで手を離す</b>（低くすればそっと置く・高くすれば上から落とす。ホイールで奥／手前、Shift＋ホイールで向き）</li>
      <li><b>マッチ</b>を選んでクリックで擦って置く。火の中の薪は<b>火ばさみ</b>で動かす</li>
      <li><b>スペース長押し</b>（またはマイク）で息を吹きかける</li>
      <li>何もない所をドラッグで見回す・ホイールで近づく</li>
      <li>左上の ≡ でモードを選び直せる</li>
    </ul>
    <button id="go" disabled>準備しています…</button>
    <p class="note" id="note">音が出ます。PC の Chrome 推奨。ゲームパッドがあれば振動します。</p>
  </div>
</div>
<div id="toast"></div>
<div id="debug"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
